{% load i18n %}{% if messages %}
<div class="pointer-events-none fixed inset-x-0 bottom-4 z-[60] flex flex-col items-center gap-2 px-4">
  {% for message in messages %}
  <div x-data="{ show: true }" x-init="setTimeout(() => show = false, 5000)" x-show="show" x-transition.opacity
       role="status" class="toast pointer-events-auto {% if message.tags == 'error' %}is-error{% endif %}">
    <span class="flex-1">{{ message }}</span>
    <button type="button" class="opacity-70 transition-opacity hover:opacity-100" @click="show = false" aria-label="{% translate 'قفل' %}">{% icon "x" "size-4" %}</button>
  </div>
  {% endfor %}
</div>
{% endif %}
