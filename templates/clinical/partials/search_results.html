{% load i18n %}
{% if q %}
<ul class="divide-y divide-stone-100 text-sm">
  {% for p in patients %}
  <li><a href="{% url 'clinical:record' p.pk %}" class="flex items-center gap-2 px-3 py-2 transition-colors hover:bg-stone-100">
    <span class="min-w-0 flex-1 truncate font-medium">{{ p.full_name }}</span>
    <span class="num text-xs text-stone-500" dir="ltr">#{{ p.file_number }}</span>
  </a></li>
  {% empty %}
  <li class="px-3 py-2 text-xs text-stone-500">{% translate "مفيش نتايج" %}</li>
  {% endfor %}
</ul>
{% endif %}
