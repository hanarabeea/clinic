{% extends "clinical/desk_base.html" %}
{% load i18n %}
{% block title %}{{ patient.full_name }}{% endblock %}
{% block desk %}
{% include "clinical/partials/header.html" %}
<div class="tabs" id="tabs" x-data
     @click="if ($event.target.matches('.tab')) { $el.querySelectorAll('.tab').forEach(b => b.classList.remove('is-active')); $event.target.classList.add('is-active') }">
  <button type="button" class="tab is-active" hx-get="{% url 'clinical:history' patient.pk %}" hx-target="#tab-body">{% translate "التاريخ" %}</button>
  <button type="button" class="tab" hx-get="{% url 'clinical:attachments' patient.pk %}" hx-target="#tab-body">{% translate "المرفقات" %}</button>
  <button type="button" class="tab" hx-get="{% url 'prescriptions:patient_list' patient.pk %}" hx-target="#tab-body">{% translate "الروشتات" %}</button>
  <button type="button" class="tab" hx-get="{% url 'clinical:data' patient.pk %}" hx-target="#tab-body">{% translate "البيانات" %}</button>
</div>
<div id="tab-body" hx-get="{% url 'clinical:history' patient.pk %}" hx-trigger="load"></div>
{% endblock %}
