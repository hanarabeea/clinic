{% load i18n %}
{% for w in warnings %}
<label class="mb-1 flex cursor-pointer items-start gap-2 rounded-lg border px-3 py-2 text-sm {% if w.kind == 'allergy' %}border-red-300 bg-red-50 text-red-900{% else %}border-amber-200 bg-amber-50 text-amber-900{% endif %}">
  <input type="checkbox" name="ack" value="{{ w.key }}" class="mt-1">
  <span>{% icon "warning" "size-4" %} {{ w.text }} <b class="ms-1 underline underline-offset-4">{% translate "متأكد" %}</b></span>
</label>
{% endfor %}
