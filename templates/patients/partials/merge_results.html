{% load i18n %}
<ul class="divide-y divide-stone-100">
  {% for c in candidates %}
  <li class="flex items-center justify-between gap-2 py-2">
    <span class="min-w-0"><span class="block truncate font-medium">{{ c.full_name }}</span><span class="num block text-xs text-stone-600" dir="ltr">#{{ c.file_number }} &nbsp; {{ c.phone }}</span></span>
    <form method="post" action="{% url 'patients:merge_confirm' primary.pk c.pk %}"
          onsubmit="return confirm('{% blocktranslate with d=c.full_name p=primary.full_name %}تدمج {{ d }} في {{ p }}؟ الخطوة دي مش قابلة للتراجع.{% endblocktranslate %}')">
      {% csrf_token %}
      <button type="submit" class="btn-secondary min-h-8 px-3 py-1 text-xs">{% translate "دمج" %}</button>
    </form>
  </li>
  {% empty %}
  <li class="py-2 text-center text-stone-500">{% translate "اكتب اسم أو رقم للبحث" %}</li>
  {% endfor %}
</ul>
