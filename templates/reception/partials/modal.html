{% load i18n %}
<div class="overlay" onclick="if (event.target === this) this.parentElement.innerHTML = ''">
  <div class="dialog max-w-md p-5" role="dialog" aria-modal="true">
    <div class="mb-4 flex items-center justify-between gap-3">
      <h2 class="text-base font-bold">{% block title %}{% endblock %}</h2>
      <button type="button" class="btn-icon -me-1.5" onclick="document.getElementById('modal').innerHTML = ''" aria-label="{% translate 'قفل' %}">{% icon "x" %}</button>
    </div>
    {% block body %}{% endblock %}
  </div>
</div>
